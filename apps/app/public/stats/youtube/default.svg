<svg xmlns="http://www.w3.org/2000/svg" width="450" height="214" viewBox="0 0 450 214">
            <defs>
                <style>
                    
    .title {
        font: 500 22px Ubuntu, Sans-Serif;
        fill: #2f80ed;
        animation: fadeInAnimation 0.8s ease-in-out forwards;
    }
    .card-bg {
        fill: #fffefe;
    }
    .stagger {
        opacity: 0;
        animation: fadeInAnimation 0.3s ease-in-out forwards;
    }
    .text {
        font: 500 16px Ubuntu, Sans-Serif;
        fill: #333;
    }
    .bold {
        font-weight: 600;
    }
    .icon-color {
        fill: #4c71f2;
        stroke: #4c71f2;
    }
    .iconStroke-reduce {
        stroke-width: 0.1px;
        stroke: #fffefe;
    }
    @keyframes fadeInAnimation {
        from {
            opacity: 0;
        }
        to {
            opacity: 1;
        }
    }
    
    .circle-rim {
        stroke: #2f80ed;
        stroke-dasharray: 250;
        fill: none;
        stroke-width: 4;
        stroke-linecap: round;
        opacity: 1;
        transform-origin: 30px 30px;
        transform: rotate(-90deg);
        animation: logoAnimation 1s forwards ease-in-out;
    }
    @keyframes logoAnimation {
        from {
            stroke-dashoffset: 251;
        }
        to {
            stroke-dashoffset: 0;
        }
    }
                </style>
            </defs>
            <rect data-testid="card-bg" x="0.5" y="0.5" rx="4" class="card-bg" height="99%" width="449" stroke="#e4e2e2" stroke-opacity="1"/>

            <g transform="translate(30 30)">
                <foreignObject transform="translate(0 0)" width="80" height="80">
                    <div xmlns="http://www.w3.org/1999/xhtml">
                        <img width="100%" height="100%" src="data:image/jpeg;base64," style="border-radius:50%" />
                    </div>
                </foreignObject>
                <g data-testid="card-logo" transform="translate(0 20)">
                    <circle class="circle-rim" cx="40" cy="40" r="40"/>
                </g>
            </g>

            <g data-testid="card-title" transform="translate(142 50)">
                <text x="0" y="0" class="title" data-testid="title">Couch Programmer</text>
            </g>

            <g data-testid="card-body" transform="translate(140 88)">
                
